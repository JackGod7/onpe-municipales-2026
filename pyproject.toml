[project]
name = "onpe-municipales-2026"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["playwright>=1.49", "pandas>=2.2", "openpyxl>=3.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.10",
]
informe = [
    "markdown>=3.11",
]
viz = [
    "matplotlib>=3.11.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/infografia_jee.py" = ["E702", "B007"]  # script de gráficos: líneas compactas de matplotlib
